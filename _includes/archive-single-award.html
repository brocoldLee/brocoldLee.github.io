{% include base_path %}

<a class="presentation-card{% unless post.thumbnail %} presentation-card--no-image{% endunless %}" href="{{ base_path }}{{ post.url }}">

  {% if post.thumbnail %}
    <div class="presentation-card__media">
      <img
        src="{{ post.thumbnail }}"
        alt="{{ post.title }}"
        class="presentation-card__image"
        {% if post.thumbnail_fit %}style="object-fit: {{ post.thumbnail_fit }};"{% endif %}
      >
    </div>
  {% endif %}

  <div class="presentation-card__content">

    <h2 class="presentation-card__title">
      {{ post.title }}
    </h2>

    {% if post.organization %}
      <div class="presentation-card__venue">
        {{ post.organization }}
      </div>
    {% endif %}

    {% if post.year %}
      <div class="presentation-card__meta">
        {{ post.year }}
      </div>
    {% endif %}

  </div>

  <div class="presentation-card__arrow">
    ›
  </div>

</a>
